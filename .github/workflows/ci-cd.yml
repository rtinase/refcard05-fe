name: CI/CD Frontend

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pro Branch/Tag läuft nur ein Run; ein neuer Push bricht den alten ab.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  AWS_REGION: us-east-1
  ECR_REPOSITORY: refcard05-fe

jobs:
  build-test:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests ausführen
        run: npm test

      - name: Produktions-Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_IMGS: ${{ vars.VITE_IMGS || 'items' }}

  image:
    name: Docker-Image bauen und nach ECR pushen
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    outputs:
      pushed: ${{ steps.gate.outputs.push }}
    steps:
      - uses: actions/checkout@v4

      # Push nur von main und Release-Tags, und nur wenn die Learner-Lab-Secrets gesetzt sind.
      - name: Push-Bedingungen prüfen
        id: gate
        env:
          HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && ( "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/tags/v* ) ]]; then
            if [[ "$HAS_AWS" == "true" ]]; then
              echo "push=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Kein ECR-Push::AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN fehlen (Learner-Lab-Session abgelaufen?). Image wird nur gebaut."
              echo "push=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: AWS-Credentials (Learner Lab, temporär)
        if: steps.gate.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bei ECR anmelden
        id: ecr
        if: steps.gate.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      # Tag-Schema: v1.2.3 -> 1.2.3 ; jeder Build -> sha-<kurz> ; main -> latest
      - name: Image-Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry || 'local' }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen (und pushen)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_IMGS=${{ vars.VITE_IMGS || 'items' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zusammenfassung
        run: |
          {
            echo "### Frontend-Image"
            echo "- Gepusht: \`${{ steps.gate.outputs.push }}\`"
            echo "- Ref: \`$GITHUB_REF_NAME\`"
            echo "- Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy nach ECS und Smoke-Test
    runs-on: ubuntu-latest
    needs: image
    if: needs.image.outputs.pushed == 'true'
    env:
      ECS_CLUSTER: refcard05-cluster
      ECS_SERVICE: refcard05-fe-service
      CONTAINER: refcard05-fe
    steps:
      - uses: actions/checkout@v4

      - name: AWS-Credentials (Learner Lab, temporär)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bei ECR anmelden
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Task-Definition aus Vorlage erzeugen
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          export ACCOUNT_ID
          # shellcheck disable=SC2016  # Variablenliste fuer envsubst bewusst in einfachen Anfuehrungszeichen
          envsubst '${ACCOUNT_ID} ${AWS_REGION}' < task-definition.json > task-definition.rendered.json
          echo "IMAGE=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Neues Image in Task-Definition eintragen
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.rendered.json
          container-name: ${{ env.CONTAINER }}
          image: ${{ env.IMAGE }}

      - name: ECS-Service aktualisieren (wartet auf Stabilität)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          desired-count: 1
          wait-for-service-stability: true

      - name: Smoke-Test
        env:
          FE_URL: ${{ vars.FE_URL }}
        run: |
          [ -n "$FE_URL" ] || { echo "::error title=Variable fehlt::GitHub-Variable FE_URL ist nicht gesetzt"; exit 1; }
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "$FE_URL/healthz" >/dev/null && curl -fsS --max-time 5 "$FE_URL/" | grep -q 'id="root"'; then
              echo "Frontend erreichbar nach Versuch $i"
              {
                echo "### Frontend deployt"
                echo "- Image: \`$IMAGE\`"
                echo "- URL: $FE_URL"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Smoke-Test fehlgeschlagen::$FE_URL ist nicht erreichbar"
          exit 1
